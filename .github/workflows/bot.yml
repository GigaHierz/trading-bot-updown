name: bot

on:
  schedule:
    - cron: "*/30 * * * *" # best-effort; the bot tolerates skipped runs
  workflow_dispatch:
    inputs:
      smoke:
        description: "Run the funded smoke test instead of a bot tick"
        type: boolean
        default: false

concurrency:
  group: trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: vars.BOT_ENABLED == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Run bot
        env:
          CELO_PRIVATE_KEY: ${{ secrets.CELO_PRIVATE_KEY }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          CELO_CHAIN_ID: "42220"
          DRY_RUN: ${{ vars.DRY_RUN }} # anything but the string "false" means dry-run
          BOT_ENABLED: "true"
        run: |
          if [ "${{ inputs.smoke }}" = "true" ]; then
            node tools/approve.js
            node tools/smoke-test.js
          else
            node src/index.js
          fi

      - name: Persist state
        if: always()
        run: |
          git config user.name "updown-bot"
          git config user.email "updown-bot@users.noreply.github.com"
          git add state/
          if git commit -m "state: $(date -u +%FT%TZ) [skip ci]"; then
            git pull --rebase && git push || (git pull --rebase && git push)
          fi
